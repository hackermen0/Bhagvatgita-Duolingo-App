<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krishna mascot — animation preview</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #fffcf7; color: #3a2b1e; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; }
  #stage { width: min(86vw, 440px); aspect-ratio: 1; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 620px; }
  button { font: 700 14px system-ui; padding: 10px 14px; border-radius: 14px; border: 2px solid #ede2d1; border-bottom-width: 4px; background: #fff; color: #3a2b1e; cursor: pointer; }
  button small { display: block; font-weight: 600; font-size: 11px; opacity: .55; }
  button:active { transform: translateY(2px); border-bottom-width: 2px; }
  button.primary { background: #3bb5f8; border-color: #1c8fd0; color: #fff; }
  button.primary small { opacity: .8; }
  #now { font: 800 13px system-ui; letter-spacing: .06em; text-transform: uppercase; color: #1c8fd0; min-height: 1.2em; }
  p { max-width: 500px; text-align: center; font-size: 13px; opacity: .7; margin: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="now">resting</div>
<div class="row" id="buttons"></div>
<div class="row">
  <button id="rest">Rest<small>0 · back to default</small></button>
  <button class="primary" id="demo">Play all<small>space</small></button>
</div>
<p>This page runs the app's own <code>src/lib/mascot/krishna.ts</code>. Like in the app, a reaction keeps its face after
the motion ends, until the next reaction or Rest. The app's mood → reaction mapping lives in <code>Mascot.svelte</code>.</p>

<script>
/*KRISHNA*/
</script>
<script>
// What each reaction is for, in the app
const ABOUT = {
  correct: 'laughing · right answer', combo: 'amazed · streak', wrong: 'disappointed · wrong answer',
  shocked: 'shocked · wrong pair', worried: 'gritted teeth · last chances', angry: 'angry',
  plead: 'teary · leaving so soon?', heartbreak: 'teary → crying · out of hearts', love: 'affectionate',
  celebrate: 'lesson complete', think: 'thinking'
};
const LENGTH = { correct: 1600, combo: 2000, wrong: 1800, shocked: 1500, worried: 2800, angry: 1900, plead: 3200, heartbreak: 3500, love: 2700, celebrate: 2600, think: 2100 };
const now = document.getElementById('now');
let k = null, demoTimer = null;

Krishna.loadKrishnaSvg().then((markup) => {
  k = Krishna.mountKrishna(document.getElementById('stage'), markup);
  const row = document.getElementById('buttons');
  Krishna.REACTIONS.forEach((r, i) => {
    const b = document.createElement('button');
    b.innerHTML = `${r}<small>${ABOUT[r] || ''}${i < 9 ? ` · ${i + 1}` : ''}</small>`;
    b.onclick = () => play(r);
    row.appendChild(b);
  });
  window.__k = k;
});

function play(r, fromDemo) {
  if (!fromDemo) clearTimeout(demoTimer);
  k.react(r);
  now.textContent = r;
}
function rest() { clearTimeout(demoTimer); k.rest(); now.textContent = 'resting'; }
function demo() {
  clearTimeout(demoTimer);
  let i = 0;
  const step = () => {
    if (i >= Krishna.REACTIONS.length) return rest();
    const r = Krishna.REACTIONS[i++];
    play(r, true);
    demoTimer = setTimeout(() => { k.rest(); now.textContent = 'resting'; demoTimer = setTimeout(step, 500); }, LENGTH[r] || 2000);
  };
  step();
}
document.getElementById('rest').onclick = rest;
document.getElementById('demo').onclick = demo;
addEventListener('keydown', (e) => {
  if (!k) return;
  if (e.key === ' ') { e.preventDefault(); demo(); }
  else if (e.key === '0') rest();
  else if (Krishna.REACTIONS[+e.key - 1]) play(Krishna.REACTIONS[+e.key - 1]);
});
</script>
</body>
</html>
